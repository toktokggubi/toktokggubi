services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    env_file:
      - .env
    volumes:
      - ./database/mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/toktokggubi_ddl.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 20s
      retries: 10
    restart: always

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
      MONGO_INITDB_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_HOST: ${MONGO_HOST}
    volumes:
      - ./database/mongodb:/data/mongodb
      - ./database/mongodb:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand({ping: 1})' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10


  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8082:8081
    env_file:
      - .env
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017
      
  rabbitmq:
    image: 'rabbitmq:management'
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    environment:
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"] 
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # AI Service (Flask)
  # ai:
  #   build:
  #     context: ./ai # Build from the Dockerfile in the ./ai directory
  #   restart: always
  #   ports:
  #     - "5000:5000"
  #   environment:
  #     - DB_HOST=postgres
  #     - POSTGRES_USER=${POSTGRES_USER}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  #     - POSTGRES_DB=${POSTGRES_DB}
  # Backend Service (Spring Boot with Gradle)
  backend:
    build:
      context: ./backend # Build from the Dockerfile in the ./backend directory
    restart: always
    ports:
      - "8080:8080" # Expose backend server port
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      # postgres:
      #   condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      # Spring Boot database connection properties (using environment variables from .env)
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/gcp-sa.json
      - FCM_ENABLED=true
      - FCM_CREDENTIALS_LOCATION=file:/run/secrets/fcm-sa.json
      # Other common environment variables for backend
    secrets:
      - source: gcp_sa_json
        target: gcp-sa.json
      - source: fcm_sa_json
        target: fcm-sa.json      
    volumes:
      - ./backend/uploads:/data/uploads

  # Frontend Service (React)
  # frontend:
  #   build:
  #     context: ./frontend # Build from the Dockerfile in the ./frontend directory
  #   restart: always
    # Frontend will be configured with specific build targets/ports in override files

  # Nginx Reverse Proxy
  nginx:
    build:
      context: ./nginx # Build from the Dockerfile in the ./nginx directory
    restart: always
    ports:
      - "80:80"
      - "443:443"
#    volumes:
      #- ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      # - frontend
      - backend
        #- ai # Nginx might proxy to AI service directly too

  # Jenkins CI/CD Server (only in development/CI environment)
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    privileged: true # Allows Jenkins to run Docker commands
    user: root
    command: --prefix=/jenkins
    ports:
      - "8081:8080" # Jenkins web UI
      - "50000:50000" # Jenkins agent port (for build agents)
    volumes:
      # Persist Jenkins data
      - ./jenkins/jenkins_home:/var/jenkins_home
      # Mount Docker socket to allow Jenkins to build/run other Docker containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount Docker client binary from host if docker-compose isn't in Jenkins image
      # - /usr/local/bin/docker:/usr/local/bin/docker
    # group_add:
    #   - "122"  
    restart: always

secrets:
  gcp_sa_json:
    file: ./secrets/toktokggubi-sa.json
  fcm_sa_json:               
    file: ./secrets/firebase-service-account.json    

