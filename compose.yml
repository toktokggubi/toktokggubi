services:
  # Database Service (PostgreSQL by default, change image for MySQL)
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      # These environment variables configure the PostgreSQL container
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      # Persist database data to avoid losing it when containers restart
      - ./database/postgres:/var/lib/postgresql/data
      # Initialize database with a script if init.sql exists
      # - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    env_file:
      - .env
    volumes:
      - ./database/mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/toktokggubi_ddl.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 20s
      retries: 10
    restart: always

  rabbitmq:
    image: 'rabbitmq:management'
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    environment:
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # AI Service (Flask)
  ai:
    build:
      context: ./ai # Build from the Dockerfile in the ./ai directory
    restart: always
    # Environment variables for AI service, if any
    # environment:
    #   - AI_MODEL_PATH=/app/model.pt

  # Backend Service (Spring Boot with Gradle)
  backend:
    build:
      context: ./backend # Build from the Dockerfile in the ./backend directory
    restart: always
    ports:
      - "8080:8080" # Expose backend server port
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Spring Boot database connection properties (using environment variables from .env)
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/gcp_sa_json
      # Other common environment variables for backend
    secrets:
      - gcp_sa_json
    volumes:
      - ./backend/uploads:/data/uploads
      
  # Frontend Service (React)
  # frontend:
  #   build:
  #     context: ./frontend # Build from the Dockerfile in the ./frontend directory
  #   restart: always
    # Frontend will be configured with specific build targets/ports in override files

  # Nginx Reverse Proxy
  nginx:
    build:
      context: ./nginx # Build from the Dockerfile in the ./nginx directory
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      # - frontend
      - backend
      - ai # Nginx might proxy to AI service directly too

  # Jenkins CI/CD Server (only in development/CI environment)
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    privileged: true # Allows Jenkins to run Docker commands
    user: root
    command: --prefix=/jenkins
    ports:
      - "8081:8080" # Jenkins web UI
      - "50000:50000" # Jenkins agent port (for build agents)
    volumes:
      # Persist Jenkins data
      - ./jenkins/jenkins_home:/var/jenkins_home
      # Mount Docker socket to allow Jenkins to build/run other Docker containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount Docker client binary from host if docker-compose isn't in Jenkins image
      # - /usr/local/bin/docker:/usr/local/bin/docker
    restart: always

secrets:
  gcp_sa_json:
    file: ./secrets/toktokggubi-sa.json