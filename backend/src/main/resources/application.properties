# App name and port
spring.application.name=backend
server.port=${SPRING_PORT:8080}

# Active profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# MySQL
spring.datasource.url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# Redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}

# MongoDB
spring.data.mongodb.host=${MONGO_HOST:mongodb}
spring.data.mongodb.port=${MONGO_PORT}
spring.data.mongodb.database=${MONGO_DATABASE}
spring.data.mongodb.username=${MONGO_ROOT_USERNAME}
spring.data.mongodb.password=${MONGO_ROOT_PASSWORD}
spring.data.mongodb.authentication-database=admin

# Proxy / forwarded headers
server.forward-headers-strategy=native

# JWT
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER}
jwt.signup-exp-minutes=${SIGNUP_EXP_MINUTES}
jwt.access-exp-minutes=${ACCESS_EXP_MINUTES}
jwt.refresh-exp-days=${REFRESH_EXP_DAYS}

# SSAFY-finance API
finance.api.base-url=${FINANCE_BASE_URL}
finance.api.key=${FINANCE_API_KEY}
finance.api.institution-code=00100
finance.api.fintech-app-no=001

# GMS LLM (proxy to OpenAI)
gms.llm.enabled=true
gms.llm.base-url=https://gms.ssafy.io/gmsapi/api.openai.com/v1
gms.llm.api-key=${GMS_API_KEY}
gms.llm.timeout.ms=5000
gms.llm.model=gpt-4o-mini

# GMS (alternative config - disabled)
#gms.enabled=${GMS_ENABLED:true}
#gms.api.key=${GMS_API_KEY}
#gms.model=gpt-4o-mini
#gms.timeout.ms=1200

# Spring AI (OpenAI) feature flags
spring.ai.openai.enabled=false
spring.ai.openai.chat.enabled=false
spring.ai.openai.speech.enabled=false
spring.ai.openai.audio.transcription.enabled=false
spring.ai.openai.embedding.enabled=false

# Google Cloud credentials (OCR)
app.ocr.credentials-path=${GOOGLE_APPLICATION_CREDENTIALS}

# Swagger / OpenAPI
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.url=/v3/api-docs

# Kakao OAuth2
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-name-attribute=sub
#spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v1/oidc/userinfo
#spring.security.oauth2.client.provider.kakao.jwk-set-uri=https://kauth.kakao.com/.well-known/jwks.json
kakao.rest-key=${KAKAO_REST_KEY}
kakao.redirect-uri=https://j13b207.p.ssafy.io/auth/kakao/callback

# OpenAI API key (for your app)
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Firebase
fcm.enabled=${FCM_ENABLED:true}
fcm.credentials.location=${FCM_CREDENTIALS_LOCATION:classpath:firebase-service-account.json}

# Time zone
spring.jackson.time-zone=Asia/Seoul
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Actuator / health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Multipart upload limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Disable Spring Boot Docker Compose integration
spring.docker.compose.enabled=false
