server.port=${SPRING_PORT:8080}

# DB
spring.datasource.url=jdbc:mysql://localhost:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

fcm.enabled=true
fcm.credentials.location=classpath:firebase-service-account.json

openai.apiKey=${OPENAI_API_KEY}

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}

# Proxy / Forwarded Headers
server.forward-headers-strategy=native

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.docker.compose.enabled=false